name: Update data snapshots

on:
  schedule:
    - cron: "43 3 1 * *" # monthly, 1st day, 03:43 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x update.sh && ./update.sh
      - name: Commit changes
        id: commit
        run: |
          git config user.name "whenisnamaz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update snapshots $(date -u +%Y-%m)"
            git push
            git diff --name-only HEAD~1 HEAD -- schedules > /tmp/changed.txt
            echo "changed=$(wc -l < /tmp/changed.txt)" >> "$GITHUB_OUTPUT"
          fi
      # jsDelivr keeps a branch copy for up to 12 hours. Without this the apps
      # would still read last month's table all day after the push.
      - name: Purge jsDelivr
        if: steps.commit.outputs.changed != '0'
        run: |
          n=0
          while read -r path; do
            curl -s -o /dev/null --max-time 15 \
              "https://purge.jsdelivr.net/gh/neolite/whenisnamaz-data@master/$path"
            n=$((n+1))
            sleep 0.2
          done < /tmp/changed.txt
          echo "purged $n files"
