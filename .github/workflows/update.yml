name: Update data snapshots

on:
  schedule:
    - cron: "43 3 1 * *" # monthly, 1st day, 03:43 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x update.sh && ./update.sh
      - name: Commit changes
        run: |
          git config user.name "whenisnamaz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update snapshots $(date -u +%Y-%m)"
          git push
